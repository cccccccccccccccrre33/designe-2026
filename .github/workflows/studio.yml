# Студия DRIVE&KAVA в GitHub Actions (ADR-0007).
#
# Днём — сессия каждый час (до 50 минут): ответы в Telegram, работа над задачами,
# сохранение состояния в зашифрованную ветку studio-state. Ночью сессия сразу
# выходит: модели не вызываются, деньги не тратятся. Точные часы — в
# studio/policies/schedule.json (по Киеву, переход на летнее время учтён в коде).
#
# Управление:
#   выключить совсем     — Settings → Secrets and variables → Actions → Variables:
#                          STUDIO_ENABLED = off  (или кнопка Disable workflow во вкладке Actions)
#   запустить сейчас      — Actions → «Студия» → Run workflow (можно сразу дать задачу)
#   проверить модели      — Run workflow → «Что сделать» = check-models
#   изучить ссылки школ   — Run workflow → «Что сделать» = study (выводы — отдельным PR)
#   пауза из Telegram     — /pause и /resume; самостоятельные задачи — /auto off и /auto on
name: Студия

on:
  schedule:
    # Каждый час в :07 с 05 до 20 UTC: летом это 08:07–23:07 по Киеву, зимой 07:07–22:07.
    # Запуски вне рабочих часов на краях выходят за секунды, без вызовов моделей.
    - cron: '7 5-20 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать'
        required: false
        type: choice
        default: session
        options:
          - session
          - check-models
          - study
      task:
        description: 'Новая задача для студии (необязательно)'
        required: false
        type: string
      minutes:
        description: 'Сколько минут работать (до 330)'
        required: false
        type: number
        default: 50
      force:
        description: 'Работать даже в нерабочее время (только этот запуск)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write        # ветка состояния studio-state и ветки версий studio/*
  pull-requests: write   # PR с версиями и merge после одобрения владельцем

concurrency:
  group: studio
  cancel-in-progress: false

jobs:
  session:
    if: vars.STUDIO_ENABLED != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Сессия студии
        env:
          STUDIO_STATE_KEY: ${{ secrets.STUDIO_STATE_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          BEDROCK_REGION: ${{ vars.BEDROCK_REGION }}
          STUDIO_IMAGES: ${{ vars.STUDIO_IMAGES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # Ввод владельца передаётся только через окружение, не подставляется в команду.
          STUDIO_TASK: ${{ inputs.task }}
          STUDIO_MINUTES: ${{ inputs.minutes }}
          STUDIO_FORCE: ${{ inputs.force }}
          STUDIO_ACTION: ${{ inputs.action }}
        # check-models — короткий вызов каждой текстовой модели и таблица в сводке (в любое время).
        run: |
          if [ "$STUDIO_ACTION" = "check-models" ]; then
            node src/cli/studio.ts check-bedrock
          elif [ "$STUDIO_ACTION" = "study" ]; then
            node src/cli/studio.ts study
          else
            node src/cli/studio.ts actions-session
          fi
      # study: выводы о вкусе и методах школ — отдельным PR; слияние — только по решению владельца.
      - name: PR с результатами изучения
        if: inputs.action == 'study'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- knowledge/study)" ]; then
            echo "Новых выводов нет."
            exit 0
          fi
          branch="studio/study-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- knowledge/study
          git commit -m "Изучение публикаций практиков: вкус и методы с цитатами"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Изучение публикаций практиков" \
            --body "Выводы задания study: что школы ценят и отвергают, приёмы и методы — только с дословными цитатами со страниц. Недоступные страницы перечислены в файлах. Сводка и расход — на странице запуска. Слияние — по решению владельца."

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      # Тесты используют сценарные модели и поддельные Telegram/GitHub — ключи не нужны.
      # Рендер — установленный на раннере google-chrome.
      - run: npm test
